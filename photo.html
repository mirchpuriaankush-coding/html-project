<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>क्लाउड डॉक्यूमेंट और फोटो गैलरी 🌐</title>
    <!-- Firebase SDK (v9 Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #38bdf8; margin-top: 25px; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
        input[type="text"] {
            width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 15px; margin-bottom: 5px;
        }
        
        /* गैलरी पिकर बॉक्स स्टाइल */
        .gallery-box {
            background: #0f172a;
            border: 2px dashed #38bdf8;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .gallery-box:hover { background: #131c31; }
        .gallery-box span { display: block; color: #38bdf8; font-size: 14px; font-weight: bold; }
        
        button.action-btn { width: 100%; background: #0284c7; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button.action-btn:hover { background: #0369a1; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 15px; }
        .photo-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; }
        .photo-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
        .photo-card p { font-size: 12px; color: #38bdf8; margin: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
        .status-msg { font-size: 13px; color: #f59e0b; text-align: center; margin-top: 8px; }
        .delete-btn { background: #ef4444; margin-top: 4px; padding: 4px; font-size: 11px; width: 100%; border: none; color: white; border-radius: 4px; cursor: pointer; }
        .id-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🗂️ क्लाउड डॉक्यूमेंट और फोटो गैलरी</h1>

    <!-- क्लाउड आईडी बॉक्स -->
    <div class="id-box">
        <span style="color: #94a3b8; display: block; margin-bottom: 5px;">🔑 आपकी क्लाउड आईडी (दूसरे फोन में डाटा लाने के लिए):</span>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="userCloudId" readonly style="margin: 0; background: #1e293b; color: #4ade80; font-weight: bold;">
            <button onclick="changeCloudId()" style="margin: 0; width: auto; background: #334155; font-size: 12px; padding: 0 12px; border:none; color:white; border-radius:6px; cursor:pointer;">आईडी बदलें</button>
        </div>
    </div>

    <h2>नया डॉक्यूमेंट या फोटो अपलोड करें</h2>
    
    <label>डॉक्यूमेंट/फोटो का नाम (जैसे: Family ID, Aadhaar, Pan Card):</label>
    <input type="text" id="docCustomName" placeholder="यहाँ नाम लिखें...">

    <label>फाइल चुनें:</label>
    <input type="file" id="photoFile" accept="image/*" style="display: none;" onchange="previewFileName()">
    
    <div class="gallery-box" onclick="document.getElementById('photoFile').click()">
        <span style="font-size: 24px;">📁</span>
        <span id="fileChosenText">गैलरी से फाइल चुनने के लिए क्लिक करें</span>
    </div>

    <button class="action-btn" onclick="uploadPhotoToCloud()">☁️ सर्वर पर सेव करें</button>
    <div id="app-msg" class="status-msg"></div>

    <h2>🔍 क्लाउड फाइलों में खोजें (Search):</h2>
    <input type="text" id="searchBox" placeholder="नाम से सर्च करें (जैसे: Aadhaar)..." oninput="renderPhotos()">

    <h2>📂 आपकी सुरक्षित क्लाउड लिस्ट:</h2>
    <div id="photosContainer" style="color: #94a3b8; font-size: 14px;">लोड हो रहा है...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB7YVFJHkQ8yRHJWIWtmsGL_SiDGJ15hxs",
        authDomain: "timecapsule-dd364.firebaseapp.com",
        databaseURL: "https://timecapsule-dd364-default-rtdb.firebaseio.com",
        projectId: "timecapsule-dd364",
        storageBucket: "timecapsule-dd364.firebasestorage.app",
        messagingSenderId: "495222564816",
        appId: "1:495222564816:web:879efe84eb6c1dfc9dbbd5"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let myCloudId = localStorage.getItem('my_unique_cloud_id');
    if (!myCloudId || myCloudId === "undefined" || myCloudId === "null") {
        myCloudId = 'user_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        localStorage.setItem('my_unique_cloud_id', myCloudId);
    }
    document.getElementById('userCloudId').value = myCloudId;

    let allPhotosData = null;

    function changeCloudId() {
        let newId = prompt("अपनी पुरानी क्लाउड आईडी यहाँ दर्ज करें:", myCloudId);
        if (newId && newId.trim() !== "") {
            myCloudId = newId.trim();
            localStorage.setItem('my_unique_cloud_id', myCloudId);
            document.getElementById('userCloudId').value = myCloudId;
            initCloudSync();
            alert("क्लाउड आईडी बदल दी गई है! पुराना डेटा लोड हो रहा है।");
        }
    }

    function previewFileName() {
        const fileInput = document.getElementById('photoFile');
        const textSpan = document.getElementById('fileChosenText');
        if (fileInput.files.length > 0) {
            textSpan.innerText = "चयनित फाइल: " + fileInput.files[0].name;
            textSpan.style.color = "#4ade80";
        }
    }

    function uploadPhotoToCloud() {
        const fileInput = document.getElementById('photoFile');
        const customNameInput = document.getElementById('docCustomName');
        const msgBox = document.getElementById('app-msg');

        if (fileInput.files.length === 0) {
            alert('कृपया पहले कोई फाइल/फोटो चुनें!');
            return;
        }

        let docName = customNameInput.value.trim();
        if (docName === "") {
            docName = fileInput.files[0].name; // यदि नाम खाली छोड़ा तो असली फाइल का नाम ले लेगा
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        msgBox.innerText = "डॉक्यूमेंट अपलोड हो रहा है, कृपया प्रतीक्षा करें...";

        reader.onload = function (e) {
            const base64Image = e.target.result;
            const photosRef = database.ref('cloud_photos/' + myCloudId);

            photosRef.push({
                image: base64Image,
                name: docName,
                timestamp: Date.now()
            }).then(() => {
                fileInput.value = '';
                customNameInput.value = '';
                document.getElementById('fileChosenText').innerText = "गैलरी से फाइल चुनने के लिए क्लिक करें";
                document.getElementById('fileChosenText').style.color = "#38bdf8";
                msgBox.innerText = "डॉक्यूमेंट सफलतापूर्वक सर्वर पर सेव हो गया! ✅";
                setTimeout(() => { msgBox.innerText = ''; }, 3000);
            }).catch((error) => {
                msgBox.innerText = "त्रुटि: " + error.message;
            });
        };

        reader.readAsDataURL(file);
    }

    function initCloudSync() {
        const photosRef = database.ref('cloud_photos/' + myCloudId);
        photosRef.on('value', (snapshot) => {
            allPhotosData = snapshot.val();
            renderPhotos();
        });
    }

    function renderPhotos() {
        const container = document.getElementById('photosContainer');
        const searchText = document.getElementById('searchBox').value.toLowerCase();
        const data = allPhotosData;

        if (!data) {
            container.innerHTML = '<p style="color: #64748b;">अभी क्लाउड पर कोई डॉक्यूमेंट सेव नहीं है।</p>';
            return;
        }

        let items = Object.keys(data).map(key => ({ id: key, ...data[key] }));

        // सर्च फिल्टर लागू करना
        if (searchText) {
            items = items.filter(item => item.name.toLowerCase().includes(searchText));
        }

        if (items.length === 0) {
            container.innerHTML = '<p style="color: #64748b;">सर्च परिणाम से कोई डॉक्यूमेंट नहीं मिला।</p>';
            return;
        }

        container.innerHTML = '<div class="gallery" id="photoGrid"></div>';
        const grid = document.getElementById('photoGrid');

        items.reverse().forEach(item => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${item.image}" alt="Document">
                <p title="${item.name}">${item.name}</p>
                <button class="delete-btn" onclick="deletePhoto('${item.id}')">हटाएं</button>
            `;
            grid.appendChild(card);
        });
    }

    function deletePhoto(photoId) {
        if (confirm("क्या आप वाकई इस डॉक्यूमेंट को हटाना चाहते हैं?")) {
            database.ref('cloud_photos/' + myCloudId + '/' + photoId).remove();
        }
    }

    initCloudSync();
</script>

</body>
</html>
